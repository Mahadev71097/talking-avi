:root{
  --ink:#3a1c55;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --ff:"Fredoka",ui-rounded,"Nunito","Varela Round",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1640;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{font-family:var(--ff);color:#fff;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:pointer}
#probe{position:absolute;visibility:hidden;pointer-events:none;top:0;left:0;padding-top:var(--st);padding-bottom:var(--sb)}
button{font-family:var(--ff)}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button{pointer-events:auto}

/* header */
.top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px}
.grp{display:flex;gap:8px;align-items:center}
.grp.r{justify-content:flex-end}
.rb{width:44px;height:44px;border-radius:50%;border:3px solid #fff;padding:0;display:grid;place-items:center;position:relative;cursor:pointer;color:#fff;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),#6b3fa8;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(40,15,70,.55),0 6px 14px rgba(30,10,50,.35);transition:transform .12s}
.rb:active{transform:scale(.88)}
.rb svg.i{width:22px;height:22px}
.rb .ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none}
.rb .ring circle{fill:none;stroke-width:4}
.rb .ring .bgc{stroke:rgba(255,255,255,.18)}
.rb .ring .lv{stroke:#7CFFA4;stroke-linecap:round;stroke-dasharray:0 200;transition:stroke-dasharray .08s linear}
#micBtn .slash{position:absolute;width:30px;height:4px;border-radius:2px;background:#ff5a6e;transform:rotate(-45deg);box-shadow:0 0 0 2px #fff;display:none}
#micBtn.off{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),rgba(255,255,255,0) 40%),#8a7a9e}
#micBtn.off .slash,#micBtn.blocked .slash{display:block}
#micBtn.blocked{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),rgba(255,255,255,0) 40%),#8a7a9e}
#micBtn.on{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),#18b56a}
#micBtn.hear{animation:hear .5s ease-in-out infinite alternate}
@keyframes hear{to{transform:scale(1.12)}}
#recBtn{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),#ff4d5e}
#recBtn .dot{width:16px;height:16px;border-radius:50%;background:#fff;transition:border-radius .2s,transform .2s}
#recBtn.on .dot{border-radius:3px;transform:scale(.9)}
#recBtn.on{animation:hear .6s ease-in-out infinite alternate}
#recTime{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;background:#ff4d5e;padding:1px 7px;border-radius:9px;display:none;white-space:nowrap}
#recBtn.on #recTime{display:block}
.logo{width:min(168px,40vw);height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(40,15,70,.5));margin-top:-2px;pointer-events:none}
.logo text{font-family:var(--ff);font-weight:700;paint-order:stroke;stroke:#3a1c55;stroke-linejoin:round}
.logo .l1{font-size:25px;fill:#ffd23f;stroke-width:7px;letter-spacing:.5px}
.logo .l2{font-size:60px;fill:#fff;stroke-width:11px;letter-spacing:1px}

/* side buttons */
.col{position:absolute;top:calc(var(--st) + 104px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.col.l{left:max(calc(8px + var(--sl)),calc(50% - 330px))}
.col.r{right:max(calc(8px + var(--sr)),calc(50% - 330px))}
.act{pointer-events:auto;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;cursor:pointer;
  font-weight:700;font-size:12.5px;letter-spacing:.2px;text-shadow:0 1px 0 #3a1c55,0 0 3px #3a1c55,0 0 6px rgba(58,28,85,.7)}
.act .bub{width:58px;height:58px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.7),rgba(255,255,255,0) 36%),var(--c);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),0 4px 0 rgba(40,15,70,.5),0 8px 14px rgba(30,10,50,.3);transition:transform .12s}
.act:active .bub{transform:scale(.86)}
.act svg{width:36px;height:36px;display:block}
.act.on .bub{animation:pulse .9s ease-in-out infinite alternate;box-shadow:0 0 0 4px rgba(255,255,255,.45),0 4px 0 rgba(40,15,70,.5),0 8px 18px rgba(30,10,50,.35)}
@keyframes pulse{to{transform:scale(1.1)}}
/* bottom status */
.bottom{position:absolute;left:0;right:0;bottom:calc(12px + var(--sb));display:flex;justify-content:center;pointer-events:none}
#status{max-width:86vw;background:rgba(40,14,66,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);
  padding:7px 15px;border-radius:999px;font-weight:600;font-size:14.5px;text-align:center;transition:opacity .3s,transform .3s;line-height:1.25}
#status.hl{background:rgba(24,150,90,.85)}
#status.sl{background:rgba(40,40,110,.85)}
#toast{position:absolute;left:50%;top:calc(var(--st) + 112px);transform:translate(-50%,-10px);opacity:0;max-width:88vw;background:#fff;color:var(--ink);
  font-weight:600;font-size:14px;padding:10px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(20,0,40,.35);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;line-height:1.3;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* overlays */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px;overflow:auto}
.ov[hidden],.sheet[hidden]{display:none}
#start{background:radial-gradient(ellipse at 50% 40%,rgba(90,40,150,.55),rgba(30,8,55,.88));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:340px;margin:auto}
.face{width:132px;height:132px;border-radius:50%;border:5px solid #fff;overflow:hidden;box-shadow:0 0 0 6px #ffd23f,0 14px 34px rgba(0,0,0,.4);animation:bob 2.2s ease-in-out infinite;background:#ffd23f}
.face img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.card .logo{width:230px;margin:14px 0 6px}
.card p{margin:4px 0 18px;font-size:16px;font-weight:500;line-height:1.4;color:#f3e9ff}
.big{border:0;border-radius:999px;padding:14px 34px;font-size:22px;font-weight:700;color:#3a1c55;cursor:pointer;
  background:linear-gradient(#ffe36b,#ffc21a);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 5px 0 #b77b00,0 12px 26px rgba(0,0,0,.35);transition:transform .12s}
.big:active{transform:translateY(3px) scale(.97)}
.big:disabled{opacity:.6}
#playBtn{animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.06)}}
.small-note{margin-top:14px;font-size:12.5px;color:#d9c8f0;opacity:.85}
.sheet{position:absolute;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,6,36,.45)}
.panel{width:100%;max-width:460px;background:#fff;color:var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sb));
  box-shadow:0 -10px 30px rgba(0,0,0,.3);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.panel h3{margin:4px 0 10px;font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid #e3d6f5;background:#f6f0ff;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip.sel{background:#6b3fa8;color:#fff;border-color:#6b3fa8}
.note{font-size:13.5px;line-height:1.4;color:#5c4a73;margin:0 0 12px;background:#fff6dc;border-radius:12px;padding:10px 12px}
.note:empty{display:none}
.row{display:flex;gap:10px;align-items:center}
.row .big{font-size:17px;padding:11px 20px}
.big.alt{background:linear-gradient(#b88cff,#8a57e0);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 5px 0 #4e2a8a}
.link{display:block;margin:12px auto 0;background:none;border:0;color:#6b3fa8;font-size:15px;font-weight:600;cursor:pointer;padding:6px 12px}
#typeIn{flex:1;min-width:0;font:600 17px var(--ff);color:var(--ink);border:2px solid #e3d6f5;border-radius:14px;padding:11px 12px;outline:none;-webkit-user-select:text;user-select:text}
#typeIn:focus{border-color:#8a57e0}
#vidEl{width:100%;max-height:52vh;border-radius:14px;background:#000;margin-bottom:12px}
#fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;background:#2a1640;font-size:17px;line-height:1.4}
@media (max-height:600px){
  .col{top:calc(var(--st) + 66px);gap:4px}
  .act b{display:none}
  .act .bub{width:46px;height:46px}
  .act svg{width:28px;height:28px}
  .logo{width:120px}
}
@media (max-height:430px){
  .top{padding-top:calc(6px + var(--st))}
  .rb{width:38px;height:38px} .rb svg.i{width:19px;height:19px}
  .logo{width:92px}
  .col{top:calc(var(--st) + 54px);gap:4px}
  .act .bub{width:40px;height:40px} .act svg{width:24px;height:24px}
  #ui #toast{top:auto;bottom:calc(var(--sb) + 58px)}
  .face{width:78px;height:78px} .card .logo{width:140px;margin:4px 0} .card p{font-size:14px;margin:2px 0 10px} .small-note{display:none}
  .big{font-size:19px;padding:11px 28px}
}
@media (max-height:430px){
  .panel{max-height:100%;overflow:auto;padding:10px 16px calc(10px + var(--sb))}
  .panel h3{margin:2px 0 6px;font-size:16px}
  #vidEl{max-height:42vh;margin-bottom:8px}
  .link{margin-top:4px}
}

</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="probe"></div>
  <div id="ui">
    <header class="top">
      <div class="grp">
        <button id="micBtn" class="rb off" aria-label="Microphone on or off">
          <svg class="ring" viewBox="0 0 58 58"><circle class="bgc" cx="29" cy="29" r="25"/><circle class="lv" cx="29" cy="29" r="25"/></svg>
          <svg class="i" viewBox="0 0 24 24" fill="#fff"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M12 17.5V21M8.5 21h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span class="slash"></span>
        </button>
        <button id="typeBtn" class="rb" aria-label="Type words for Avi to say">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M7.5 14h9"/></svg>
        </button>
      </div>
      <svg class="logo" viewBox="0 0 220 104" aria-label="Talking Avi" role="img"><text class="l1" x="110" y="30" text-anchor="middle">Talking</text><text class="l2" x="110" y="91" text-anchor="middle">Avi</text></svg>
      <div class="grp r">
        <button id="recBtn" class="rb" aria-label="Record a video"><span class="dot"></span><span id="recTime">0:00</span></button>
        <button id="setBtn" class="rb" aria-label="Settings">

        </button>

    <nav class="col l">
      <button class="act" data-act="milk" style="--c:#38b6f2" aria-label="Milk"><span class="bub">

      <button class="act" data-act="love" style="--c:#ff4d6d" aria-label="Love"><span class="bub">

      </span><b>Sleep</b></button>

<script>
(function(){
'use strict';

/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const nowS=()=>performance.now()/1000;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TAU=Math.PI*2;
const ease={
  out:t=>1-(1-t)*(1-t), in:t=>t*t, inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
const store={
  get(k,d){try{const v=localStorage.getItem('talkingavi_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('talkingavi_'+k,JSON.stringify(v));}catch(e){}}
};

/* ================= character rig (pixel coords in the cut-out photo) ================= */
const R={
  W:790,H:1502,EXT:420,TW:1024,TH:2048,
  foot:[425,1502], bodyCX:440,
  neck:[442,505], band:[468,548],
  eyeL:[375,281,27,12.5], eyeR:[499.5,276,27,12], tilt:-0.05,
  mouth:[442.5,399.5,40], slope:-0.052, curve:0.0036, chinY:462,
  nose:[438,328], cheekL:[350,352], cheekR:[532,345],
  head:[440,245,195,240], face:[440,372,124,118],
  headTop:[440,40], earL:[285,362], earR:[600,350],
  heart:[462,815,188,172],
  bulbs:[[339,683],[462,730],[592,708],[571,837],[441,948]],
  handL:[322,882], handR:[585,862], belly:[440,1130], hipL:[300,1210], hipR:[590,1210]
};

/* ================= springs & animation state ================= */
class Spring{
  constructor(v,k,d){this.v=v;this.t=v;this.vel=0;this.k=k;this.d=d;}
  step(dt){const a=this.k*(this.t-this.v)-this.d*this.vel;this.vel+=a*dt;this.v+=this.vel*dt;}
  set(v){this.v=v;this.t=v;this.vel=0;}
}
const S={
  headRot:new Spring(0,140,14), headX:new Spring(0,140,14), headY:new Spring(0,160,15),
  headSX:new Spring(1,320,11), headSY:new Spring(1,320,11),
  sway:new Spring(0,90,11), sqX:new Spring(1,320,13), sqY:new Spring(1,320,13),
  jump:new Spring(0,140,14), zoom:new Spring(1,80,14), spin:new Spring(0,60,11),
  mouth:new Spring(0,900,42), wide:new Spring(1,260,24),
  lookX:new Spring(0,520,42), lookY:new Spring(0,520,42),
  blush:new Spring(0,30,10), dim:new Spring(1,10,6.5), lid:new Spring(0,380,32),
  listen:new Spring(0,60,13), disco:new Spring(0,20,9)
};
const st={
  started:false, sleeping:false, lastInteract:nowS(), yawned:false,
  listening:false, voicePlaying:false, ttsTalking:false,
  mouthAct:0, wideAct:1, lookUntil:0, idleAmt:1, breathMul:1,
  shakeAmp:0, shakeFreq:14, shakeDecay:4,
  heartLights:[0,0,0,0,0], heartAll:0, dizzyUntil:0, pokes:[]
};
const H={rot:0,ox:0,oy:0,sx:1,sy:1};
const idle={rot:0,sway:0,hy:0,breath:0};
let shakeX=0, voiceLvl=0, mouthTTS=0;

/* ================= layout & transforms ================= */
let vw=1,vh=1,dpr=1,s0=0.4,ax=0,ay=0,safeT=0,safeB=0;
const G={a:1,b:0,c:0,d:1,e:0,f:0};
function updateG(){
  const s=s0*S.zoom.v*(1+S.listen.v*0.025);
  let cx=Math.cos(S.spin.v); if(Math.abs(cx)<0.03) cx=cx<0?-0.03:0.03;
  const sx=s*S.sqX.v*cx, sy=s*S.sqY.v;
  const r=S.sway.v+idle.sway, cs=Math.cos(r), sn=Math.sin(r);
  G.a=cs*sx; G.b=sn*sx; G.c=-sn*sy; G.d=cs*sy;
  const fx=R.foot[0], fy=R.foot[1];
  G.e=ax+shakeX-(G.a*fx+G.c*fy);
  G.f=ay-S.jump.v-(G.b*fx+G.d*fy);
}
function gFwd(x,y){return [G.a*x+G.c*y+G.e, G.b*x+G.d*y+G.f];}
function gInv(X,Y){const det=G.a*G.d-G.b*G.c, dx=X-G.e, dy=Y-G.f;return [(G.d*dx-G.c*dy)/det,(-G.b*dx+G.a*dy)/det];}
function headFwd(x,y){
  const hw=1-sstep(R.band[0],R.band[1],y); if(hw<=0) return [x,y];
  const dx=(x-R.neck[0])*lerp(1,H.sx,hw), dy=(y-R.neck[1])*lerp(1,H.sy,hw);
  const r=H.rot*hw, cs=Math.cos(r), sn=Math.sin(r);
  return [R.neck[0]+cs*dx-sn*dy+H.ox*hw, R.neck[1]+sn*dx+cs*dy+H.oy*hw];
}
function headInv(x,y){
  const hw=1-sstep(R.band[0],R.band[1],y); if(hw<=0) return [x,y];
  const dx=x-R.neck[0]-H.ox*hw, dy=y-R.neck[1]-H.oy*hw;
  const r=-H.rot*hw, cs=Math.cos(r), sn=Math.sin(r);
  return [R.neck[0]+(cs*dx-sn*dy)/lerp(1,H.sx,hw), R.neck[1]+(sn*dx+cs*dy)/lerp(1,H.sy,hw)];
}
function fwd(x,y){const h=headFwd(x,y);return gFwd(h[0],h[1]);}
function inv(X,Y){const g=gInv(X,Y);return headInv(g[0],g[1]);}
function scaleNow(){return s0*S.zoom.v;}

const bgc=$('#bg'), fxc=$('#fx'); let glc=$('#gl');
const bctx=bgc.getContext('2d'), fctx=fxc.getContext('2d');
function readSafe(){
  const p=$('#probe'); const cs=getComputedStyle(p);
  safeT=parseFloat(cs.paddingTop)||0; safeB=parseFloat(cs.paddingBottom)||0;
}
function layout(){
  vw=Math.max(1,window.innerWidth); vh=Math.max(1,window.innerHeight);
  dpr=Math.min(window.devicePixelRatio||1,2);
  readSafe();
  s0=Math.min(vh*0.79/R.H, vw*0.96/R.W);
  if(vw>vh && vh<520) s0=Math.min(vh*0.74/R.H, vw*0.96/R.W);
  ax=vw/2; ay=vh+R.H*s0*0.012;
  for(const c of [bgc,glc,fxc]){c.width=Math.round(vw*dpr);c.height=Math.round(vh*dpr);}
  ctx2d=null;
  buildBg();
  placeBalloons();
}

/* ================= WebGL character renderer ================= */
const VS=`attribute vec2 aPos;uniform vec4 uRect;uniform vec2 uView;varying vec2 vPos;
void main(){vPos=mix(uRect.xy,uRect.zw,aPos);vec2 c=vPos/uView*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.0,1.0);}`;
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vPos;
uniform sampler2D uTex;
uniform vec2 uTexSize;uniform vec2 uSrcSize;
uniform mat3 uInv;
uniform vec2 uNeck;uniform vec2 uBand;uniform vec2 uHeadOff;uniform vec2 uHeadScale;
uniform float uHeadRot;uniform float uBreath;
uniform vec4 uPk[4];
uniform vec4 uMouth;uniform vec4 uMouthB;uniform vec4 uEyeL;uniform vec4 uEyeR;uniform vec4 uEyeB;uniform vec4 uCheek;
uniform vec3 uFx;
vec4 tx(vec2 p){
  vec4 c=texture2D(uTex,p/uTexSize);
  float ins=step(0.0,p.x)*step(0.0,p.y)*step(p.x,uSrcSize.x)*step(p.y,uSrcSize.y);
  return c*ins;
}
vec2 rot(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
// eye: returns look offset (xy) and writes lid/lash/skin; branch-free
void eyeFx(vec2 p,vec4 E,inout vec2 off,inout float lid,inout float lash,inout vec2 skin){
  vec2 e=rot(p-E.xy,-uEyeB.w);
  vec2 n=e/E.zw;
  float r=length(n);
  float near=1.0-step(1.7,r);
  float lm=(1.0-smoothstep(0.65,1.1,r))*near;
  off+=rot(vec2(uEyeB.y*E.z*0.2,uEyeB.z*E.w*0.22),uEyeB.w)*lm;
  float b=uEyeB.x;
  float edge=mix(-1.35,0.74,b)+0.34*b*(1.0-n.x*n.x);
  vec2 nm=vec2(n.x*0.95,n.y*mix(1.0,0.72,step(0.0,n.y)));

/* music for dancing */
function startMusic(){
  const ac=AC; if(!ac) return null;
  const out=ac.createGain(); out.gain.value=0.5; out.connect(sfxBus);
  const sing=ac.createGain(); sing.gain.value=0.75; sing.connect(vocalBus);
  const bpm=116, beat=60/bpm, t0=ac.currentTime+0.12, bars=8;
  const chords=[48,43,45,41];
  const mel=[[76,79,84,79,76,79,81,79],[74,79,83,79,74,79,81,79],[72,76,81,76,84,83,81,79],[77,81,84,81,79,77,76,74]];
  const last=[77,81,84,81,79,76,72,72];
  for(let bar=0;bar<bars;bar++){
    const tb=t0+bar*4*beat, root=chords[bar%4], ml=bar===bars-1?last:mel[bar%4];
    for(let q=0;q<4;q++){
      const tq=tb+q*beat;
      osc(ac,out,tq,{f0:150,f1:42,dur:0.2,vol:0.9});
      if(q%2===1){nz(ac,out,tq,{dur:0.16,vol:0.45,type:'bandpass',f0:1800,Q:0.8,a:0.002});osc(ac,out,tq,{type:'triangle',f0:200,f1:160,dur:0.08,vol:0.25});}
    }
    for(let e=0;e<8;e++){
      const te=tb+e*beat/2;
      if(e%2===1) nz(ac,out,te,{dur:0.05,vol:0.16,type:'highpass',f0:7000,a:0.002});
      osc(ac,out,te,{type:'square',f0:mtof(root+(e%2?12:0)-12),dur:beat*0.42,vol:0.13,a:0.004});
      if(bar<4||bar>=bars-1||e%2===0) osc(ac,out,te,{type:'square',f0:mtof(ml[e]),dur:beat*0.4,vol:0.07,a:0.004});
    }
    if(bar>=4){
      for(let q=0;q<4;q++){
        const n=ml[q*2]-12;
        vox(ac,sing,tb+q*beat,{f:[mtof(n)*1.01,mtof(n)],v:['e','a'],dur:beat*0.72,vol:0.42,vib:7});
      }
    }
  }
  const tend=t0+bars*4*beat;
  [60,64,67,72].forEach(n=>osc(ac,out,tend,{type:'triangle',f0:mtof(n),dur:1.2,vol:0.12,a:0.005}));
  const dur=tend-ac.currentTime+1.0;
  markBusy(dur);
  return {t0,beat,dur,stop(){try{const n=ac.currentTime;out.gain.cancelScheduledValues(n);out.gain.setTargetAtTime(0,n,0.04);sing.gain.cancelScheduledValues(n);sing.gain.setTargetAtTime(0,n,0.04);setTimeout(()=>{try{out.disconnect();sing.disconnect();}catch(e){}},500);busyUntil=Math.min(busyUntil,n+0.5);}catch(e){}}};
}

const VOICES={
  avi:{label:'Baby Avi',pitch:1.72,tempo:1.12},

  giant:{label:'Giant',pitch:0.68,tempo:0.88},
  robot:{label:'Robot',pitch:1.32,tempo:1.05,robot:true}

const SENS={low:{label:'Low',min:0.022,mul:4.2},mid:{label:'Normal',min:0.012,mul:3.2},high:{label:'High',min:0.006,mul:2.4}};
const settings={voice:store.get('voice','avi'),sens:store.get('sens','mid')};

function hann(N){const w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=0.5-0.5*Math.cos(TAU*i/N);return w;}
function wsola(x,stretch,sr){
  if(Math.abs(stretch-1)<0.01||x.length<sr*0.1) return x;
  const N=(Math.round(sr*0.032)>>1)<<1, Hs=N>>1, Ha=Hs/stretch, tol=Math.round(sr*0.01), L=Hs;
  const D=4, xd=new Float32Array(Math.ceil(x.length/D));
  for(let i=0,j=0;i<x.length;i+=D,j++){let s=0,c=0;for(let k=0;k<D&&i+k<x.length;k++){s+=x[i+k];c++;}xd[j]=s/c;}
  const outLen=Math.ceil(x.length*stretch)+N;
  const y=new Float32Array(outLen), ws=new Float32Array(outLen), win=hann(N);
  let prev=0, lastOut=0;
  for(let k=0;;k++){
    const op=k*Hs, nom=Math.round(k*Ha);
    if(nom+N+tol>=x.length||op+N>=outLen) break;
    let best=nom;
    if(k>0){
      const nat=prev+Hs, natD=(nat/D)|0, Ld=(L/D)|0;
      const lo=Math.max(0,nom-tol), hi=Math.min(x.length-N-1,nom+tol);
      let bc=-Infinity, bd=nom;
      for(let c=lo;c<=hi;c+=D){
        const cd=(c/D)|0; let s=0;
        for(let i=0;i<Ld;i+=2) s+=xd[natD+i]*xd[cd+i];
        if(s>bc){bc=s;bd=c;}
      }
      bc=-Infinity; best=bd;
      for(let c=Math.max(lo,bd-D);c<=Math.min(hi,bd+D);c++){
        let s=0; for(let i=0;i<L;i+=4) s+=x[nat+i]*x[c+i];
        if(s>bc){bc=s;best=c;}
      }
    }
    for(let i=0;i<N;i++){y[op+i]+=x[best+i]*win[i];ws[op+i]+=win[i];}
    prev=best; lastOut=op+N;
  }
  const n=Math.max(1,lastOut-Hs);
  const out=new Float32Array(n);
  for(let i=0;i<n;i++) out[i]=ws[i]>0.08?y[i]/ws[i]:y[i];
  return out;
}

let micStream=null, micSrc=null, proc=null, micZero=null, micState='off', micLevel=0, micBlocked=false, micP=null;
const VAD={state:'idle',floor:0.006,above:0,below:0,voiced:0,wake:0,rmsSum:0,chunks:[],pre:[]};
const sheetOpen=()=>!!document.querySelector('.sheet:not([hidden])');
const PRE_CHUNKS=6;
function micSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
function startMic(){
  if(!micP) micP=startMicImpl().finally(()=>{micP=null;});
  return micP;
}
function setAudioSession(){ try{ if(navigator.audioSession) navigator.audioSession.type=micStream?'play-and-record':'playback'; }catch(e){} }
async function startMicImpl(){
  if(!initAudio()){setMic('blocked');return false;}
  if(!micSupported()){micBlocked=true;setMic('blocked');return false;}
  if(micStream){setMic('on');return true;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
  }catch(e){
    micStream=null; micBlocked=true; setMic('blocked');
    toast(e&&e.name==='NotAllowedError'?'Microphone is blocked here. Tap the keyboard button to type words for Avi, or allow the mic in your browser.':'No microphone found. Tap the keyboard button to type words for Avi.',4200);
    return false;
  }
  try{
    micSrc=AC.createMediaStreamSource(micStream);
    proc=AC.createScriptProcessor(2048,1,1);
    micZero=AC.createGain(); micZero.gain.value=0;
    micSrc.connect(proc); proc.connect(micZero); micZero.connect(AC.destination);
    proc.onaudioprocess=onMic;
    micStream.getAudioTracks().forEach(tr=>{ tr.onended=()=>{ if(micStream){ stopMic(); setMic('off'); toast('The mic stopped. Tap 🎤 to turn it back on.',3200); } }; });
    micBlocked=false; VAD.state='idle'; VAD.pre=[]; VAD.above=0; setMic('on'); setAudioSession();
    return true;
  }catch(e){ console.warn(e); stopMic(); micBlocked=true; setMic('blocked'); return false; }
}
function stopMic(){
  try{ if(proc){proc.onaudioprocess=null;proc.disconnect();} if(micZero) micZero.disconnect(); if(micSrc) micSrc.disconnect(); if(micStream) micStream.getTracks().forEach(t=>{t.onended=null;t.stop();}); }catch(e){}
  proc=null; micSrc=null; micZero=null; micStream=null; VAD.state='idle'; VAD.chunks=[]; VAD.pre=[]; VAD.above=0; micLevel=0;
  setAudioSession();
  if(st.listening) setListening(false);
}
function onMic(e){
  const x=e.inputBuffer.getChannelData(0);
  let s=0; for(let i=0;i<x.length;i++) s+=x[i]*x[i];
  const rms=Math.sqrt(s/x.length);
  micLevel=rms;
  if(micState!=='on'||!st.started) return;
  if(VAD.state==='busy') return;
  const cfg=SENS[settings.sens]||SENS.mid;
  const on=Math.max(cfg.min,VAD.floor*cfg.mul), off=on*0.6;
  if(st.sleeping){
    if(VAD.state==='hearing') cancelHearing();
    VAD.pre=[];
    if(rms>Math.max(on*1.6,0.03)){ if(++VAD.wake>=3){ VAD.wake=0; wakeUp(); busyUntil=Math.max(busyUntil,AC.currentTime+0.8); } }
    else VAD.wake=0;
    return;
  }
  if(sheetOpen()){ if(VAD.state==='hearing') cancelHearing(); VAD.pre=[]; VAD.above=0; return; }
  if(audioBusy()){ if(VAD.state==='hearing') cancelHearing(); VAD.pre=[]; VAD.above=0; return; }
  const buf=new Float32Array(x);
  if(VAD.state==='idle'){
    VAD.pre.push(buf); if(VAD.pre.length>PRE_CHUNKS) VAD.pre.shift();
    if(rms>on){
      if(++VAD.above>=2){
        VAD.state='hearing'; VAD.chunks=VAD.pre.slice(); VAD.pre=[]; VAD.below=0; VAD.voiced=2; VAD.rmsSum=rms*2; VAD.above=0; VAD.lv=[rms];
        onHearStart();
      }
    } else {
      VAD.above=0;
      VAD.floor=rms<VAD.floor?VAD.floor*0.8+rms*0.2:VAD.floor*0.996+rms*0.004;
      VAD.floor=clamp(VAD.floor,0.0006,0.05);
    }
  } else if(VAD.state==='hearing'){
    VAD.chunks.push(buf); VAD.rmsSum+=rms; if(rms>off) VAD.lv.push(rms);
    if(rms>off){VAD.below=0;VAD.voiced++;} else VAD.below++;
    const chunkDur=x.length/AC.sampleRate, dur=VAD.chunks.length*chunkDur;
    if(VAD.below>=Math.ceil(0.72/chunkDur)||dur>9) finishHearing(chunkDur);

}
function cancelHearing(){VAD.state='idle';VAD.chunks=[];VAD.above=0;setListening(false);}
function finishHearing(chunkDur){

  // speech pulses with syllables; a fan / TV hum / traffic is flat. Flat + long = background noise.
  let cv=1; const lv=VAD.lv||[];
  if(lv.length>=20){ let m=0; lv.forEach(v=>m+=v); m/=lv.length; let q=0; lv.forEach(v=>q+=(v-m)*(v-m)); cv=Math.sqrt(q/lv.length)/Math.max(m,1e-6); }
  if((chunks.length*chunkDur>=8.9&&VAD.voiced/chunks.length>0.9)||cv<0.2){
    // steady loud background (TV, fan, traffic): learn it as the new noise floor instead of repeating it
    const cfg=SENS[settings.sens]||SENS.mid;
    VAD.floor=clamp(VAD.rmsSum/chunks.length/(0.5*cfg.mul),0.0006,0.05);
    VAD.state='idle'; setListening(false); return;
  }
  if(st.sleeping){VAD.state='idle';setListening(false);wakeUp();return;}
  const keep=Math.max(1,chunks.length-Math.max(0,VAD.below-Math.ceil(0.18/chunkDur)));
  chunks=chunks.slice(0,keep);
  let n=0; chunks.forEach(c=>n+=c.length);
  const data=new Float32Array(n); let o=0; chunks.forEach(c=>{data.set(c,o);o+=c.length;});

function onHearStart(){

}
function setListening(on){
  st.listening=on;
  S.listen.t=on?1:0;
  updateStatus();
  $('#micBtn').classList.toggle('hear',on);
}
function playVoice(data){
  initAudio();
  const sr=AC.sampleRate, mode=VOICES[settings.voice]||VOICES.avi;
  let pk=0; for(let i=0;i<data.length;i++){const a=Math.abs(data[i]);if(a>pk)pk=a;}
  const g=Math.min(10,0.92/Math.max(pk,1e-4));
  let y=wsola(data,mode.pitch/mode.tempo,sr);
  const fade=Math.min(y.length>>2,Math.round(sr*0.012));
  for(let i=0;i<y.length;i++){let v=y[i]*g; if(i<fade) v*=i/fade; else if(i>y.length-fade) v*=(y.length-i)/fade; y[i]=v;}
  const b=AC.createBuffer(1,y.length,sr); b.getChannelData(0).set(y);
  const src=AC.createBufferSource(); src.buffer=b; src.playbackRate.value=mode.pitch;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=mode.pitch<1?60:140;
  const pkf=AC.createBiquadFilter(); pkf.type='peaking'; pkf.frequency.value=3000; pkf.gain.value=3; pkf.Q.value=0.8;
  const out=AC.createGain(); out.gain.value=1.0;
  src.connect(hp); hp.connect(pkf);
  let robo=null;
  if(mode.robot){
    const rm=AC.createGain(); rm.gain.value=0; const l=AC.createOscillator(); l.frequency.value=70; l.connect(rm.gain); l.start();
    const dry=AC.createGain(); dry.gain.value=0.35;
    pkf.connect(rm); rm.connect(out); pkf.connect(dry); dry.connect(out); robo=l;
  } else pkf.connect(out);
  out.connect(vocalBus);
  const dur=y.length/sr/mode.pitch;
  setListening(false);
  st.voicePlaying=true; VAD.state='busy'; updateStatus();
  src.onended=()=>{
    st.voicePlaying=false; if(robo){try{robo.stop();}catch(e){}}
    busyUntil=Math.max(busyUntil,AC.currentTime+0.35);
    VAD.state='idle'; VAD.pre=[]; VAD.above=0; updateStatus();
  };
  src.start();
  markBusy(dur);
  // safety in case onended never fires
  setTimeout(()=>{ if(st.voicePlaying&&AC.currentTime>busyUntil){ st.voicePlaying=false; VAD.state='idle'; updateStatus(); } },(dur+2)*1000);
}

/* text-to-speech (type to talk / dictation) */
let claudeDict=null, claudeDl=null, dictating=false;
function speakSupported(){return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';}
function sayText(text){
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,200);
  if(!text) return;
  st.lastInteract=nowS();
  if(st.sleeping) wakeUp();
  if(!speakSupported()){toast("This browser can't speak typed words.");return;}
  try{
    const u=new SpeechSynthesisUtterance(text);
    const v=settings.voice;
    u.pitch=v==='giant'?0.1:v==='robot'?0.6:2; u.rate=v==='chip'?1.45:v==='giant'?0.8:1.05; u.volume=1;
    const vs=speechSynthesis.getVoices()||[];
    const en=vs.filter(x=>/^en/i.test(x.lang));
    const pref=en.find(x=>/female|samantha|karen|tessa|zira|google us english|aria|jenny/i.test(x.name))||en[0];
    if(pref) u.voice=pref;
    u.onstart=()=>{st.ttsTalking=true;updateStatus();};
    u.onend=u.onerror=()=>{st.ttsTalking=false;if(AC)busyUntil=Math.max(busyUntil,AC.currentTime+0.4);updateStatus();};
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    st.ttsTalking=true; updateStatus();
    setTimeout(()=>{ if(st.ttsTalking&&!speechSynthesis.speaking){st.ttsTalking=false;updateStatus();} },text.length*120+3000);
  }catch(e){ st.ttsTalking=false; toast("Couldn't speak that one."); }
}
function initClaude(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    window.claude.use('dictation').then(d=>{
      if(!d) return; claudeDict=d;
      try{
        d.onFinal(({text})=>{ if(text&&text.trim()) sayText(text); });
        d.onState(({state})=>{ dictating=state==='listening'; setListening(dictating); });
      }catch(e){}
      updateMicUI();
    }).catch(()=>{});
    window.claude.use('downloads').then(d=>{ if(d) claudeDl=d; }).catch(()=>{});
  }catch(e){}
}

function drawBalloon(c,x,y,r,col){

  c.quadraticCurveTo(x+r*0.3,y+r*2,x-r*0.1,vh+20); c.stroke();

  c.fillStyle=col[1]; c.beginPath(); c.moveTo(x-r*0.12,y+r*1.16); c.lineTo(x+r*0.12,y+r*1.16); c.lineTo(x,y+r*1.02); c.closePath(); c.fill();

function drawBg(t){
  bctx.setTransform(1,0,0,1,0,0);
  if(bgStatic) bctx.drawImage(bgStatic,0,0);
  bctx.setTransform(dpr,0,0,dpr,0,0);
  const night=1-S.dim.v;
  // disco beams
  if(S.disco.v>0.02){
    bctx.save(); bctx.globalCompositeOperation='lighter';
    const cols=['255,80,120','80,200,255','255,220,60','160,110,255'];
    for(let i=0;i<4;i++){
      const ang=Math.sin(t*1.3+i*1.7)*0.6, x=vw*(0.15+i*0.23), y=-20;
      bctx.save(); bctx.translate(x,y); bctx.rotate(ang);
      const g=bctx.createLinearGradient(0,0,0,vh); g.addColorStop(0,`rgba(${cols[i]},${0.42*S.disco.v})`); g.addColorStop(1,`rgba(${cols[i]},0)`);
      bctx.fillStyle=g; bctx.beginPath(); bctx.moveTo(-6,0); bctx.lineTo(6,0); bctx.lineTo(vw*0.16,vh); bctx.lineTo(-vw*0.16,vh); bctx.closePath(); bctx.fill(); bctx.restore();
    }
    for(let i=0;i<6;i++){
      const x=vw/2+Math.sin(t*0.9+i)*vw*0.4, y=floorY+20+((i*37)%60)+Math.cos(t*1.2+i)*10;
      bctx.fillStyle=`rgba(${cols[i%4]},${0.35*S.disco.v})`; bctx.beginPath(); bctx.ellipse(x,y,40,12,0,0,TAU); bctx.fill();
    }
    bctx.restore();
  }
  // balloons
  for(const b of balloons){
    if(b.popped){ if(t>b.respawn){b.popped=false;b.rise=vh*0.5;} else continue; }
    b.rise*=Math.pow(0.25,1/60*0.9);
    if(b.rise<0.5) b.rise=0;
    const p=balloonPos(b,t); drawBalloon(bctx,p[0],p[1],b.r,b.col);
  }
  if(night>0.01){
    bctx.fillStyle=`rgba(12,10,48,${clamp(night*1.25,0,0.75)})`; bctx.fillRect(0,0,vw,vh);
    const mx=vw*0.8, my=safeT+(vh<600?60:120)+40;
    bctx.globalAlpha=clamp(night*2,0,1);
    const g=bctx.createRadialGradient(mx,my,0,mx,my,70); g.addColorStop(0,'rgba(255,245,200,.5)'); g.addColorStop(1,'rgba(255,245,200,0)');
    bctx.fillStyle=g; bctx.fillRect(mx-70,my-70,140,140);
    bctx.fillStyle='#fff3c4'; bctx.beginPath(); bctx.arc(mx,my,22,0,TAU); bctx.fill();
    bctx.fillStyle=`rgba(12,10,48,1)`; bctx.globalAlpha=clamp(night*2,0,1)*0.85; bctx.beginPath(); bctx.arc(mx+10,my-7,19,0,TAU); bctx.fill();
    bctx.globalAlpha=1;
  }
  // fairy lights on the garland
  bctx.save(); bctx.globalCompositeOperation='lighter';
  const boost=1+night*1.6+S.disco.v;
  garland.forEach((p,i)=>{
    const tw=0.55+0.45*Math.sin(t*2.2+i*1.9);
    const s=10*tw*boost; bctx.globalAlpha=clamp(0.5*tw*boost,0,1);
    bctx.drawImage(glowSprite,p[0]-s,p[1]-s,s*2,s*2);
  });
  bctx.restore();
}

function drawFx(t){

  const sc=scaleNow();

  R.bulbs.forEach((b,i)=>{

    if(lv<0.02) return;
    const p=gFwd(b[0],b[1]), s=sc*95*lv*(0.9+0.1*Math.sin(t*20+i));

  });
  c.restore();
  // listening ear waves
  if(S.listen.v>0.05){
    const e=fwd(R.earL[0],R.earL[1]);
    c.save(); c.strokeStyle='#fff'; c.lineCap='round';
    for(let i=0;i<3;i++){
      const k=((t*1.6+i/3)%1), r=14+k*30;

      c.beginPath(); c.arc(e[0]+6,e[1],r,Math.PI*0.72,Math.PI*1.28); c.stroke();
    }

  if(t<st.dizzyUntil){
    const h=fwd(R.headTop[0],R.headTop[1]+40), rx=sc*190, ry=sc*40;
    const fade=clamp(st.dizzyUntil-t,0,1);
    for(let i=0;i<4;i++){

      c.save(); c.globalAlpha=fade; c.fillStyle=i%2?'#ffd23f':'#fff'; c.strokeStyle='#3a1c55'; c.lineWidth=2;

  for(const p of props){ try{ p.draw(c,t); }catch(e){} }
  drawParts(c);
}

/* ================= actions system ================= */
const CANCEL={};
let actionToken=0, curAction=null;
const tickers=new Set();
function animate(dur,fn){
  return new Promise(res=>{
    const t0=nowS();
    const tk={run:(t)=>{const k=clamp((t-t0)/dur,0,1);try{fn(k,t);}catch(e){} if(k>=1){tickers.delete(tk);res();}},end:()=>{tickers.delete(tk);res();}};
    tickers.add(tk);
  });
}
function relax(){
  S.headRot.t=0;S.headX.t=0;S.headY.t=0;S.headSX.t=1;S.headSY.t=1;S.sway.t=0;S.sqX.t=1;S.sqY.t=1;S.jump.t=0;S.zoom.t=1;
  S.spin.v=S.spin.v-TAU*Math.round(S.spin.v/TAU); S.spin.t=0;
  st.mouthAct=0; st.wideAct=1; S.lid.t=0; S.blush.t=0; st.shakeAmp=0; S.disco.t=0;
  document.querySelectorAll('.act.on').forEach(b=>b.classList.remove('on'));
}
function endAction(){
  if(curAction){ curAction.cleanup.forEach(f=>{try{f();}catch(e){}}); curAction.cleanup=[]; curAction=null; }
}
function runAction(name,fn,arg){
  const tok=++actionToken;
  if(curAction) relax();
  endAction();
  const me={name,tok,cleanup:[]}; curAction=me;
  const alive=()=>tok===actionToken;
  const A={
    alive,
    wait:async ms=>{await sleep(ms); if(!alive()) throw CANCEL;},
    anim:async(dur,f)=>{await animate(dur,(k,t)=>{if(alive())f(k,t);}); if(!alive()) throw CANCEL;},
    prop:p=>{props.add(p); me.cleanup.push(()=>props.delete(p)); return p;},
    onEnd:f=>me.cleanup.push(f)
  };
  const btn=document.querySelector(`.act[data-act="${name}"]`);
  if(btn&&(name==='dance'||name==='sleep')) btn.classList.add('on');
  return (async()=>{
    try{ await fn(A,arg); }catch(e){ if(e!==CANCEL) console.warn('action',name,e); }
    if(tok===actionToken){ endAction(); relax(); }
  })();
}
function cancelAction(){ actionToken++; endAction(); relax(); }

function doAct(name,arg){

  if(name==='sleep'&&st.sleeping){ wakeUp(); return; }
  if(name==='dance'&&curAction&&curAction.name==='dance'){ cancelAction(); return; }
  runAction(name,ACT[name],arg);
}
function wakeUp(){
  if(!st.sleeping) return;
  st.sleeping=false; st.idleAmt=1; st.breathMul=1; S.dim.t=1; st.lastInteract=nowS();
  cancelAction(); updateStatus();
  runAction('wake',ACT.wake);
}

/* ================= input ================= */
const touches=new Map();
function region(X,Y){
  const g=gInv(X,Y), p=headInv(g[0],g[1]);
  const inE=(c,x,y)=>((x-c[0])/c[2])**2+((y-c[1])/c[3])**2<1;
  const near=(c,r)=>Math.hypot(p[0]-c[0],p[1]-c[1])<r;
  if(inE(R.head,p[0],p[1])&&alphaAt(p[0],p[1])>30){
    if(near(R.nose,40)) return 'nose';
    if(near(R.cheekL,48)) return 'cheekL';
    if(near(R.cheekR,48)) return 'cheekR';
    if(inE(R.face,p[0],p[1])) return 'face';
    return 'head';
  }
  if(alphaAt(g[0],g[1])<40) return null;
  if(near(R.handL,62)||near(R.handR,62)) return 'hand';
  if(inE(R.heart,g[0],g[1])) return 'heart';
  if(g[1]>1290) return 'legs';
  if(g[1]>990) return 'belly';
  return 'body';
}
function hitBubble(X,Y){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; if(p.kind==='bubble'&&Math.hypot(p.x-X,p.y-Y)<p.size*1.25) return p;}
  return null;
}
function hitBalloon(X,Y,t){
  for(const b of balloons){ if(b.popped) continue; const p=balloonPos(b,t); if(((X-p[0])/(b.r*1.05))**2+((Y-p[1])/(b.r*1.25))**2<1) return b; }
  return null;
}
function onDown(e){
  if(!st.started) return;
  e.preventDefault();
  unlockAudio();
  const X=e.clientX, Y=e.clientY, t=nowS();
  st.lastInteract=t; st.yawned=false;
  try{ fxc.setPointerCapture(e.pointerId); }catch(_){}
  const bub=hitBubble(X,Y);
  if(st.sleeping){ if(bub) popBubble(bub,false); wakeUp(); return; }
  if(bub){ popBubble(bub,false); return; }
  const r=region(X,Y);
  lookAtScreen(X,Y,1.4);
  if(r){ pokeScreen(X,Y,r==='belly'||r==='heart'?-0.28:0.3,60); vibrate(12); }
  else { const b=hitBalloon(X,Y,t); if(b){ popBalloon(b,t); return; } }
  touches.set(e.pointerId,{x0:X,y0:Y,x:X,y:Y,t0:t,r,done:false,rub:0});
}
function onMove(e){
  const g=touches.get(e.pointerId);
  if(!g){ if(st.started&&e.pointerType==='mouse'&&(e.buttons===0)&&Math.random()<0.1) lookAtScreen(e.clientX,e.clientY,0.8); return; }
  const X=e.clientX, Y=e.clientY, dx=X-g.x0, dy=Y-g.y0;
  g.rub+=Math.hypot(X-g.x,Y-g.y); g.x=X; g.y=Y;
  lookAtScreen(X,Y,1);
  if(g.done) return;
  const dt=nowS()-g.t0;
  if((g.r==='head'||g.r==='face'||g.r==='nose'||g.r==='cheekL'||g.r==='cheekR')&&Math.abs(dx)>55&&dt<0.9&&Math.abs(dx)>Math.abs(dy)*1.2){
    g.done=true; doAct('spin',dx>0?1:-1); return;
  }
  if((g.r==='belly'||g.r==='body'||g.r==='heart')&&g.rub>260){ g.done=true; doAct('belly',[X,Y]); }
}
function onUp(e){
  const g=touches.get(e.pointerId); touches.delete(e.pointerId);
  if(!g||g.done) return;
  const dist=Math.hypot(g.x-g.x0,g.y-g.y0), dt=nowS()-g.t0;
  if(dist>40) return;
  const P=[g.x0,g.y0];
  switch(g.r){
    case 'head': doAct('bonk',P); break;
    case 'face': doAct('hey',P); break;
    case 'nose': doAct('boop',P); break;
    case 'cheekL': doAct('cheek',-1); break;
    case 'cheekR': doAct('cheek',1); break;
    case 'heart': doAct('love'); break;
    case 'belly': doAct(dt>0.55?'tickle':'belly',P); break;
    case 'hand': doAct('yay',P); break;
    case 'legs': doAct('jump'); break;
    case 'body': doAct('body',P); break;
  }
}
function popBalloon(b,t){
  const p=balloonPos(b,t);
  b.popped=true; b.respawn=t+4; b.rise=0;
  play('balloonPop'); vibrate(25);
  burst('conf',p[0],p[1],14,{color:b.col[0],spMin:120,spMax:300,ay:400,life:0.9});
  comicText('POP!',p[0],p[1]-b.r,'#fff');
  if(!st.voicePlaying) doAct('balloonStartle');
}
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
fxc.addEventListener('pointerdown',onDown,{passive:false});

/* ================= video recording ================= */
let rec=null, recCanvas=null, recCtx=null, recChunks=[], recStart=0, recURL=null, recBlob=null, recMime='';
function canRecord(){ return !!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream); }
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function startRec(){
  if(!canRecord()){ toast('Video recording is not supported in this browser.'); return; }
  initAudio(); unlockAudio();
  try{
    const k=Math.min(1,1280/Math.max(vw*dpr,vh*dpr));
    const W=Math.round(vw*dpr*k/2)*2, Hh=Math.round(vh*dpr*k/2)*2;
    recCanvas=document.createElement('canvas'); recCanvas.width=W; recCanvas.height=Hh; recCtx=recCanvas.getContext('2d');
    recCtx.drawImage(bgc,0,0,W,Hh);
    const vs=recCanvas.captureStream(30);
    if(!recDest){ recDest=AC.createMediaStreamDestination(); comp.connect(recDest); }
    const ms=new MediaStream([...vs.getVideoTracks(),...recDest.stream.getAudioTracks()]);
    recMime=pickMime();
    rec=new MediaRecorder(ms,recMime?{mimeType:recMime,videoBitsPerSecond:3500000}:undefined);
    recChunks=[];
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
    rec.onstop=finishRec;
    rec.start(500); recStart=nowS();
    $('#recBtn').classList.add('on');
    toast('Recording! Tap the red button again to stop.',1800);
  }catch(e){ console.warn(e); rec=null; toast('Could not start recording here.'); }
}
function stopRec(){ if(rec&&rec.state!=='inactive'){ try{ rec.stop(); }catch(e){ finishRec(); } } $('#recBtn').classList.remove('on'); }
function finishRec(){
  const mime=(rec&&rec.mimeType)||recMime||'video/webm'; rec=null;
  $('#recBtn').classList.remove('on');
  if(!recChunks.length){ toast('Recording was empty.'); return; }
  recBlob=new Blob(recChunks,{type:mime.split(';')[0]}); recChunks=[];
  if(recURL) URL.revokeObjectURL(recURL);
  recURL=URL.createObjectURL(recBlob);
  const v=$('#vidEl'); v.src=recURL;
  const canShare=!!(navigator.canShare&&navigator.share&&(()=>{try{return navigator.canShare({files:[new File([recBlob],'talking-avi.'+extFor(mime),{type:recBlob.type})]});}catch(e){return false;}})());
  $('#vidShare').style.display=canShare?'':'none';
  $('#vidNote').textContent='';
  openSheet('#vidSheet');
}
function extFor(m){ return /mp4/.test(m)?'mp4':'webm'; }
$('#recBtn').addEventListener('click',()=>{ if(!st.started) return; if(rec) stopRec(); else startRec(); });
$('#vidSave').addEventListener('click',async()=>{
  if(!recBlob) return;
  const name='talking-avi.'+extFor(recBlob.type);
  if(claudeDl){
    try{ await claudeDl.save({filename:name,data:recBlob}); $('#vidNote').textContent='Saved!'; return; }
    catch(e){ if(e&&e.code==='declined') return; }
  }
  try{ const a=document.createElement('a'); a.href=recURL; a.download=name; document.body.appendChild(a); a.click(); a.remove(); $('#vidNote').textContent='If nothing downloaded, long-press the video to save it.'; }
  catch(e){ $('#vidNote').textContent='Long-press the video to save it.'; }
});
$('#vidShare').addEventListener('click',async()=>{
  if(!recBlob) return;
  try{ await navigator.share({files:[new File([recBlob],'talking-avi.'+extFor(recBlob.type),{type:recBlob.type})],title:'Talking Avi'}); }
  catch(e){ if(e&&e.name!=='AbortError') $('#vidNote').textContent='Sharing is not available here — use Save instead.'; }
});
function compositeRec(){
  if(!recCtx) return;
  const W=recCanvas.width, Hh=recCanvas.height, c=recCtx;
  c.drawImage(bgc,0,0,W,Hh); c.drawImage(glc,0,0,W,Hh); c.drawImage(fxc,0,0,W,Hh);
  const s=W/vw;
  c.save(); c.font=`700 ${Math.round(26*s)}px Fredoka, sans-serif`; c.textAlign='center'; c.lineJoin='round';
  c.lineWidth=7*s; c.strokeStyle='#3a1c55'; c.fillStyle='#fff';
  c.strokeText('Talking Avi',W/2,Hh-24*s); c.fillText('Talking Avi',W/2,Hh-24*s); c.restore();
}

let rafId=0, lastT=nowS(), errCount=0, levelSm=0;
function update(t,dt){
  for(const tk of Array.from(tickers)) tk.run(t);
  // voice level → mouth
  let lvl=0;
  if(vocalAn&&anBuf){ vocalAn.getFloatTimeDomainData(anBuf); let s=0; for(let i=0;i<anBuf.length;i++) s+=anBuf[i]*anBuf[i]; lvl=Math.sqrt(s/anBuf.length); }
  voiceLvl=lvl;
  let mv=clamp((lvl-0.008)*170,0,23);
  if(st.ttsTalking){ mouthTTS=4+9*Math.abs(Math.sin(t*10.5))*(0.6+0.4*Math.sin(t*3.3)); mv=Math.max(mv,mouthTTS); }
  S.mouth.t=Math.max(st.mouthAct,mv);
  S.wide.t=st.wideAct*(mv>2?1+0.15*Math.sin(t*9):1);
  updLook(t);
  const n=Math.max(1,Math.ceil(dt/(1/90))), h=dt/n;
  for(let i=0;i<n;i++) for(const k in S) S[k].step(h);
  updPokes(dt);
  st.shakeAmp*=Math.exp(-dt*st.shakeDecay);
  shakeX=st.shakeAmp*Math.sin(t*st.shakeFreq*TAU);
  if(!curAction||curAction.name!=='love'&&curAction.name!=='dance'){ for(let i=0;i<5;i++) st.heartLights[i]=Math.max(0,st.heartLights[i]-dt*1.5); st.heartAll=Math.max(0,st.heartAll-dt*1.5); }

  const ia=st.idleAmt, bp=st.sleeping?4.6:3.4;

  idle.sway=ia*0.008*Math.sin(t*0.43+0.5);
  idle.hy=1.3*Math.sin(t*TAU/bp+1.0)*(st.sleeping?2:ia);
  idle.breath=0.006*st.breathMul*(0.5+0.5*Math.sin(t*TAU/bp));
  const talk=(st.voicePlaying||st.ttsTalking)?1:0;
  H.rot=S.headRot.v+idle.rot+S.listen.v*0.075+talk*0.035*Math.sin(t*6.5)*clamp(lvl*12+st.ttsTalking*0.6,0,1);
  H.ox=S.headX.v+S.listen.v*5; H.oy=S.headY.v+idle.hy-talk*clamp(lvl*40,0,3);

  updParts(dt);
  // mic level ring
  levelSm=lerp(levelSm,micState==='on'?clamp(micLevel*14,0,1):0,0.35);
  const circ=2*Math.PI*25; ringEl.style.strokeDasharray=`${(levelSm*circ).toFixed(1)} 200`;
  // boredom
  if(st.started&&!st.sleeping&&!curAction&&!st.voicePlaying&&!st.listening&&!st.ttsTalking&&!sheetOpen()){
    const idleFor=t-st.lastInteract;
    if(idleFor>24&&!st.yawned){ st.yawned=true; runAction('yawn',ACT.yawn); }
    else if(idleFor>75){ runAction('sleep',ACT.sleep); }
  }

  if(rec){ const s=Math.floor(t-recStart); $('#recTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
}
